<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Areena</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><circle cx='5' cy='5' r='4' fill='%23e6194b'/></svg>">
<style>
  html, body { margin: 0; height: 100%; background: #0e1014; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; user-select: none; }
  canvas { display: block; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #info { top: 10px; left: 12px; font-size: 14px; line-height: 1.5; }
  #list { top: 10px; right: 12px; font-size: 14px; line-height: 1.6; text-align: right; }
  #list .kd { display: inline-block; min-width: 46px; color: #ddd; font-variant-numeric: tabular-nums; }
  #feed { top: 120px; right: 12px; font-size: 14px; line-height: 1.9; text-align: right; }
  #feed div { background: rgba(0,0,0,.45); padding: 1px 8px; border-radius: 4px; margin-bottom: 3px; display: inline-block; }
  /* Lipas oikeassa alakulmassa */
  #ammo { right: 26px; bottom: 24px; display: none; text-align: right; color: #efe6cf; }
  #ammo .box { background: rgba(42,38,34,.82); border: 3px solid #2a2622; border-radius: 8px; padding: 6px 14px 8px; min-width: 120px; }
  #ammo .num { font: 700 46px Georgia, "Times New Roman", serif; line-height: 1; }
  #ammo .max { font: 700 20px Georgia, serif; color: #b9ae94; margin-left: 4px; }
  #ammo .name { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #b9ae94; margin-top: 2px; }
  #ammo .bar { height: 5px; background: #3a3530; border-radius: 3px; margin-top: 5px; overflow: hidden; visibility: hidden; }
  #ammo .bar i { display: block; height: 100%; width: 0; background: #efe6cf; }
  #ammo.empty .num { color: #e2392c; }
  #ammo.reloading .bar { visibility: visible; }

  /* Vahinkonumerot */
  .dmg { position: fixed; left: 0; top: 0; pointer-events: none; font: 800 24px system-ui, sans-serif; color: #ff3b30;
         text-shadow: 0 0 3px #000, 0 2px 2px #000; transform: translate(-50%, -50%); white-space: nowrap; }

  /* Tähtäin ( · ) */
  #cross { left: 50%; top: 50%; width: 40px; height: 24px; margin: -12px 0 0 -20px; display: none; }
  #cross path, #cross circle { transition: stroke .08s, fill .08s; }
  #cross.hit .fg { stroke: #ff3b30; } #cross.hit circle.fg { fill: #ff3b30; }

  /* Elämäplussa */
  #health { left: 26px; bottom: 22px; width: 130px; height: 130px; display: none; }
  #health.low { animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  #hpnum { font: 700 34px Georgia, "Times New Roman", serif; }

  #hurt { inset: 0; box-shadow: inset 0 0 160px 40px rgba(220,0,0,.75); opacity: 0; transition: opacity .35s; }
  #dead { inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(90,0,0,.35); font-size: 30px; font-weight: 700; }
  #dead small { font-size: 16px; font-weight: 400; margin-top: 8px; color: #eee; }

  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,10,14,.82); overflow-y: auto; }
  .overlay > .card { margin: auto; }
  .card { background: #1d2129; padding: 26px 30px; border-radius: 12px; width: min(580px, 92vw); box-shadow: 0 10px 40px #0009; }
  .card h1 { margin: 0 0 6px; font-size: 28px; }
  .card .sub { color: #99a; font-size: 14px; margin-bottom: 14px; }
  /* ====== Hahmovalikko ====== */
  #lobby { position: fixed; inset: 0; display: flex; flex-direction: column; background: #2e2c29; color: #efe6cf; font-family: system-ui, sans-serif; }
  .m-top { flex: 0 0 auto; display: flex; justify-content: center; align-items: flex-end; gap: 14px; padding: 14px 20px 8px; background: #2e2c29; border-bottom: 3px solid #1f1d1b; }
  .m-group { text-align: left; }
  .m-group .cap { font: 14px Georgia, serif; letter-spacing: 2px; color: #a59b86; text-transform: uppercase; margin-top: 4px; }
  .m-slots { display: flex; gap: 6px; padding: 6px; background: #3a3632; border-radius: 6px; }
  .cls { position: relative; width: clamp(80px, 11vw, 130px); aspect-ratio: 1; border-radius: 4px; cursor: pointer; overflow: hidden;
         background: radial-gradient(circle at 50% 35%, #6d6253, #3d372f); }
  .cls img { width: 100%; height: 100%; object-fit: cover; filter: sepia(.9) saturate(.5) brightness(.65); transition: filter .12s, transform .12s; }
  .cls:hover img { filter: none; transform: scale(1.05); }
  .cls.sel { outline: 3px solid #efe6cf; outline-offset: -3px; }
  .cls.sel img { filter: none; }
  .cls .key { position: absolute; left: 6px; bottom: 3px; font: 700 15px Georgia, serif; color: #efe6cf; text-shadow: 0 1px 2px #000; }
  .cls .nm { position: absolute; right: 6px; bottom: 3px; font: 700 13px Georgia, serif; letter-spacing: 1px; color: #efe6cf; text-shadow: 0 1px 2px #000; text-transform: uppercase; }
  .cls.random { display: flex; align-items: center; justify-content: center; font: 700 54px Georgia, serif; color: #7d7262; background: #3d372f; }
  .cls.random:hover { color: #efe6cf; }

  .m-mid { flex: 1 1 auto; position: relative; min-height: 0; overflow: hidden;
           background: linear-gradient(#d9d4c9, #c3bcaf 72%, #3a3530 72%, #3a3530 73.2%, #8a7d6a 73.2%, #6e6353); }
  #preview { position: absolute; left: 3%; bottom: 0; width: 30%; height: 100%; }
  #preview canvas { display: block; }
  .m-name { position: absolute; left: 35%; top: 4%; font: 700 clamp(28px, 4.5vw, 52px) Georgia, serif; color: #3a3530; letter-spacing: 2px; text-transform: uppercase; }
  .m-name small { display: block; font: 16px Georgia, serif; letter-spacing: 1px; color: #6a6052; text-transform: none; }
  .m-weapons { position: absolute; left: 35%; top: 26%; width: clamp(140px, 15vw, 190px); background: #2e2c29; border-radius: 4px; padding: 10px; box-shadow: 0 4px 12px #0005; }
  .m-weapons h3 { margin: 0 0 8px; text-align: center; font: 700 22px Georgia, serif; letter-spacing: 2px; color: #efe6cf; text-transform: uppercase; }
  .m-weapon { border: 1px solid #5a534a; border-radius: 4px; padding: 8px 6px 6px; text-align: center; }
  .m-weapon svg { width: 80%; height: auto; }
  .m-weapon b { display: block; font: 700 13px Georgia, serif; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }
  .m-weapon small { display: block; font-size: 11px; color: #b9ae94; margin-top: 3px; line-height: 1.4; }
  .m-board { position: absolute; left: 54%; right: 4%; top: 9%; bottom: 33%; background: #3c4346; border: 12px solid #b6b1a7; border-radius: 3px;
             box-shadow: inset 0 0 30px #0007, 0 6px 14px #0006; padding: clamp(10px, 2vw, 26px); overflow: hidden; }
  .m-board::after { content: ""; position: absolute; left: 10%; right: 10%; bottom: -12px; height: 6px; background: #8f8a80; }
  .m-board ul { margin: 0; padding: 0; list-style: none; }
  .m-board li { font: clamp(13px, 1.45vw, 19px)/1.45 "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; color: #e9ecea; margin-bottom: .7em; padding-left: 1.4em; position: relative; }
  .m-board li::before { content: "✚"; position: absolute; left: 0; color: #c9cfcc; font-size: .8em; top: .15em; }
  .m-stats { display: flex; gap: 18px; margin-top: .4em; font: 14px Georgia, serif; color: #c9cfcc; flex-wrap: wrap; }
  .m-stats b { color: #fff; }

  .m-bottom { flex: 0 0 auto; display: flex; align-items: center; gap: 18px; padding: 12px 28px; background: #2e2c29; border-top: 3px solid #1f1d1b; flex-wrap: wrap; }
  .m-title { font: clamp(24px, 3vw, 36px) Georgia, serif; letter-spacing: 2px; color: #efe6cf; text-transform: uppercase; }
  .m-fields { display: flex; gap: 10px; flex: 1; justify-content: center; }
  .m-fields label { display: block; font-size: 11px; color: #a59b86; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
  .m-fields input { width: 170px; box-sizing: border-box; padding: 8px 10px; font-size: 15px; border-radius: 4px; border: 1px solid #5a534a; background: #1f1d1b; color: #efe6cf; }
  #join { padding: 12px 34px; font: 700 18px Georgia, serif; letter-spacing: 1.5px; text-transform: uppercase; border: 0; border-radius: 6px; background: #b0473a; color: #f6eee0; cursor: pointer; box-shadow: 0 3px 0 #7a2f26; }
  #join:hover { background: #c45446; }
  #msg { flex-basis: 100%; text-align: right; color: #f3a093; font-size: 14px; min-height: 0; }
  #msg:empty { display: none; }
  .hint { position: absolute; right: 4%; bottom: 3%; font-size: 12px; color: #e3dccd; text-shadow: 0 1px 2px #000; text-align: right; line-height: 1.5; }

  #pause .card { text-align: center; width: auto; cursor: pointer; }
  #copy { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border: 0; border-radius: 6px; background: rgba(43,48,64,.8); color: #ddd; cursor: pointer; display: none; font-size: 13px; }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="info" class="hud"></div>
<div id="list" class="hud"></div>
<div id="feed" class="hud"></div>
<div id="ammo" class="hud"><div class="box"><span class="num" id="ammoNum">10</span><span class="max" id="ammoMax">/ 10</span>
  <div class="name" id="ammoName">Pistooli</div><div class="bar"><i id="reloadBar"></i></div></div></div>
<div id="hurt" class="hud"></div>

<svg id="cross" class="hud" viewBox="0 0 40 24">
  <g fill="none" stroke-linecap="round">
    <path d="M10 2 Q2 12 10 22" stroke="#000" stroke-opacity=".6" stroke-width="4"/>
    <path d="M30 2 Q38 12 30 22" stroke="#000" stroke-opacity=".6" stroke-width="4"/>
    <path class="fg" d="M10 2 Q2 12 10 22" stroke="#fff" stroke-width="2"/>
    <path class="fg" d="M30 2 Q38 12 30 22" stroke="#fff" stroke-width="2"/>
  </g>
  <circle cx="20" cy="12" r="2.6" fill="#000" fill-opacity=".6"/>
  <circle class="fg" cx="20" cy="12" r="1.6" fill="#fff"/>
</svg>

<svg id="health" class="hud" viewBox="0 0 120 120">
  <defs>
    <clipPath id="plus"><path id="plusPath" d="M40 6 H80 V40 H114 V80 H80 V114 H40 V80 H6 V40 H40 Z"/></clipPath>
    <linearGradient id="beige" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2e9d2"/><stop offset="1" stop-color="#c9bb96"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2392c"/><stop offset="1" stop-color="#a5150d"/></linearGradient>
  </defs>
  <path d="M40 6 H80 V40 H114 V80 H80 V114 H40 V80 H6 V40 H40 Z" fill="#3a3530"/>
  <rect id="hpfill" x="0" y="0" width="120" height="120" fill="url(#beige)" clip-path="url(#plus)"/>
  <path id="hpoutline" d="M40 6 H80 V40 H114 V80 H80 V114 H40 V80 H6 V40 H40 Z" fill="none" stroke="#2a2622" stroke-width="7" stroke-linejoin="miter"/>
  <text id="hpnum" x="60" y="72" text-anchor="middle" fill="#5a5247">250</text>
</svg>

<div id="dead" class="hud"><div id="deadText"></div><small id="deadTimer"></small></div>
<button id="copy">Kopioi huoneen linkki</button>

<div id="lobby">
  <div class="m-top">
    <div class="m-group">
      <div class="m-slots" id="classes"></div>
      <div class="cap">Hahmot</div>
    </div>
    <div class="m-group">
      <div class="m-slots"><div class="cls random" id="random" title="Satunnainen hahmo">?</div></div>
      <div class="cap">&nbsp;</div>
    </div>
  </div>

  <div class="m-mid">
    <div id="preview"></div>
    <div class="m-name" id="mName"></div>
    <div class="m-weapons">
      <h3>Aseesi</h3>
      <div class="m-weapon">
        <svg viewBox="0 0 120 70"><g fill="#c9c3b6" stroke="#1f1d1b" stroke-width="2" stroke-linejoin="round">
          <path d="M8 14 H104 L110 20 V30 H44 L40 36 H34 L30 30 H8 Z"/>
          <path d="M38 30 H60 L56 64 H34 Q30 64 31 59 Z" fill="#6b4a2e"/>
          <path d="M44 30 Q46 42 54 40 L56 30" fill="none"/>
          <rect x="96" y="9" width="6" height="5" fill="#1f1d1b"/>
        </g></svg>
        <b>Pistooli</b>
        <small id="mWeapon"></small>
      </div>
    </div>
    <div class="m-board"><ul id="mPoints"></ul><div class="m-stats" id="mStats"></div></div>
    <div class="hint">WASD liikkuu · välilyönti hyppää · hiiri tähtää<br>vasen painike ampuu · R lataa · Esc vapauttaa hiiren</div>
  </div>

  <div class="m-bottom">
    <div class="m-title">Valitse hahmo</div>
    <div class="m-fields">
      <div><label for="name">Nimesi</label><input id="name" maxlength="16" placeholder="esim. Totti"></div>
      <div><label for="room">Huone</label><input id="room" maxlength="16" placeholder="esim. testi"></div>
    </div>
    <button id="join">Liity peliin</button>
    <div id="msg"></div>
  </div>
</div>

<div id="pause" class="overlay" style="display:none">
  <div class="card"><h1>Klikkaa pelataksesi</h1><div class="sub">Hiiri lukittuu peliin. Esc vapauttaa sen.</div></div>
</div>

<script type="module">
import * as THREE from "three";

// ====== ASETUS: oman Cloudflare-palvelimesi osoite ======
const PROD_SERVER = "wss://areena.pallopeli.workers.dev";
const isLocal = ["localhost", "127.0.0.1", ""].includes(location.hostname);
const SERVER = new URLSearchParams(location.search).get("server") || (isLocal ? "ws://localhost:8787" : PROD_SERVER);

// ====== Hahmojen nimet ja kuvaukset ======
// Pelin arvot (nopeus, hyppy, elämät...) tulevat palvelimelta liityttäessä.
// Alla olevat luvut ovat vain valikkoa varten.
const CLASSES = {
  panssari: { name: "Jari", sub: "160 cm · jykevä", speed: 5.6, jump: 9.28, radius: 0.6, height: 1.6, hp: 300, points: [
    "Sinulla on eniten elämiä: 300.",
    "Olet hitain, mutta hyppäät yhtä korkealle kuin Juha.",
    "Olet lyhyt ja leveä, joten sinuun on helppo osua.",
    "Pysy suojassa ja anna muiden tulla luoksesi." ] },
  sotilas:  { name: "Juha", sub: "195 cm · pömppömaha ja silmälasit", speed: 6.8, jump: 9.28, radius: 0.5, height: 1.95, hp: 250, points: [
    "Olet tasapainoinen: 250 elämää ja kohtuullinen nopeus.",
    "Olet pisin, joten näet matalien muurien yli.",
    "Pistooli tekee eniten vahinkoa lähietäisyydeltä." ] },
  vikkela:  { name: "Jarmo", sub: "180 cm · hihaton paita", speed: 8.3, jump: 10.86, radius: 0.42, height: 1.8, hp: 200, points: [
    "Olet nopein, mutta sinulla on vähiten elämiä: 200.",
    "Hyppäät korkeimmalle ja pääset laatikoiden päälle helposti.",
    "Juokse lähelle, ammu ja väistä ennen kuin sinuun osutaan." ] },
};
let WEAPON = { name: "Pistooli", cooldownMs: 280, mag: 10, reloadMs: 1300, range: 120, dmgNear: [18, 22] }; // palvelin lähettää oikeat arvot

let GRAVITY = 32;          // palvelin lähettää oikean arvon
const STEP = 0.55;          // näin korkealle noustaan ilman hyppyä (portaat)
const SEND_MS = 50;         // oma sijainti palvelimelle 20 krt/s
const INTERP_DELAY = 100;   // muut pelaajat näytetään 100 ms viiveellä, sulavasti
const SENS = 0.0022;        // hiiren herkkyys

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

// ====== Lobby ======
let chosenClass = "sotilas";
try { chosenClass = localStorage.getItem("areena-hahmo") || chosenClass; } catch {}
if (!CLASSES[chosenClass]) chosenClass = "sotilas";

let hoverClass = null;
const shownClass = () => hoverClass || chosenClass;
const portraits = {}; // hahmokuvat ylärivissä (piirretään 3D:stä käynnistyksessä)

function renderClasses() {
  $("classes").innerHTML = Object.entries(CLASSES).map(([key, c], i) => `
    <div class="cls ${key === chosenClass ? "sel" : ""}" data-k="${key}" title="${c.name}">
      ${portraits[key] ? `<img src="${portraits[key]}" alt="${c.name}">` : ""}
      <span class="key">${i + 1}</span><span class="nm">${c.name}</span>
    </div>`).join("");
  for (const el of document.querySelectorAll("#classes .cls")) {
    el.onclick = () => selectClass(el.dataset.k);
    el.onmouseenter = () => { hoverClass = el.dataset.k; renderInfo(); };
    el.onmouseleave = () => { hoverClass = null; renderInfo(); };
  }
  renderInfo();
}
function selectClass(k) {
  chosenClass = k;
  try { localStorage.setItem("areena-hahmo", k); } catch {}
  renderClasses();
}
// Taulu, nimi ja aseen tiedot näytetyn hahmon mukaan
function renderInfo() {
  const c = CLASSES[shownClass()];
  $("mName").innerHTML = `${esc(c.name)}<small>${esc(c.sub || "")}</small>`;
  $("mPoints").innerHTML = (c.points || []).map((t) => `<li>${esc(t)}</li>`).join("");
  $("mStats").innerHTML = `<span>Elämät <b>${c.hp}</b></span><span>Nopeus <b>${c.speed}</b></span><span>Hyppy <b>${(c.jump * c.jump / (2 * GRAVITY)).toFixed(2)} m</b></span>`;
  $("mWeapon").textContent = `${WEAPON.mag} ammusta · lähellä ${WEAPON.dmgNear?.[0] ?? 18}–${WEAPON.dmgNear?.[1] ?? 22} vahinkoa`;
}
$("random").onclick = () => {
  const keys = Object.keys(CLASSES);
  selectClass(keys[Math.floor(Math.random() * keys.length)]);
};
addEventListener("keydown", (e) => { // 1, 2, 3 valitsevat hahmon valikossa
  if ($("lobby").style.display === "none" || document.activeElement?.tagName === "INPUT") return;
  const k = Object.keys(CLASSES)[Number(e.key) - 1];
  if (k) selectClass(k);
});
renderClasses();

const params = new URLSearchParams(location.search);
$("room").value = params.get("room") || "";
try { $("name").value = localStorage.getItem("pallopeli-nimi") || ""; } catch {}
$("join").onclick = join;
[$("name"), $("room")].forEach((el) => el.addEventListener("keydown", (e) => { if (e.key === "Enter") join(); }));

// ====== Three.js-näkymä ======
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc4e4);
scene.fog = new THREE.Fog(0x9cc4e4, 60, 170);

const camera = new THREE.PerspectiveCamera(80, innerWidth / innerHeight, 0.05, 300);
camera.rotation.order = "YXZ";
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xdfefff, 0x4a4a3a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(25, 40, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 70, bottom: -70, near: 1, far: 160 });
scene.add(sun);

// Kenttä rakennetaan, kun palvelin lähettää sen (liittyessä)
let ARENA_X = 30, ARENA_Z = 60;
let BOXES = [];
let world = null;

function buildWorld(map) {
  if (world) { scene.remove(world); world.traverse((o) => { o.geometry?.dispose?.(); o.material?.dispose?.(); }); }
  world = new THREE.Group();
  ARENA_X = map.x; ARENA_Z = map.z;
  BOXES = map.boxes.map(([minX, minY, minZ, maxX, maxY, maxZ, color]) => ({ minX, minY, minZ, maxX, maxY, maxZ, color }));

  // Lattia ruudukolla
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#5d6b4f"; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = "#4c5841"; g.lineWidth = 4; g.strokeRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(ARENA_X, ARENA_Z);
  tex.colorSpace = THREE.SRGBColorSpace;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA_X * 2, ARENA_Z * 2), new THREE.MeshStandardMaterial({ map: tex }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  world.add(floor);

  // Ulkoseinät
  for (const [x, z, w, d] of [[0, -ARENA_Z - 0.5, ARENA_X * 2 + 2, 1], [0, ARENA_Z + 0.5, ARENA_X * 2 + 2, 1], [-ARENA_X - 0.5, 0, 1, ARENA_Z * 2], [ARENA_X + 0.5, 0, 1, ARENA_Z * 2]]) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 4, d), new THREE.MeshStandardMaterial({ color: 0x3b4252 }));
    wall.position.set(x, 2, z);
    wall.receiveShadow = true;
    world.add(wall);
  }

  // Laatikot, seinät, tornit
  for (const b of BOXES) {
    const w = b.maxX - b.minX, h = b.maxY - b.minY, d = b.maxZ - b.minZ;
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: b.color }));
    mesh.position.set((b.minX + b.maxX) / 2, (b.minY + b.maxY) / 2, (b.minZ + b.maxZ) / 2);
    mesh.castShadow = mesh.receiveShadow = true;
    world.add(mesh);
  }
  scene.add(world);
}

// ====== Oma ase (näkyy ruudun oikeassa alakulmassa) ======

      shoulderY: 0.61, shoulderX: 0.32, armLen: 0.64, armR: 0.085, sleeve: 0, armOut: 0.1, tank: true,
      headY: 0.785, headR: 0.15, hair: 0x3a2414,
    },
  }[kind] || null;
  if (!P) return charSpec("sotilas", shirt);

  const leg = (s) => ({
    name: s < 0 ? "legL" : "legR", p: [s * P.hipX, P.legLen, 0], c: [
      { p: [0, -(P.legLen - 0.06) / 2, 0], m: { t: "capsule", r: P.legR, l: Math.max(0.02, P.legLen - 0.06 - 2 * P.legR), col: P.pants } },
      { p: [0, -P.legLen + 0.04, -0.05], m: { t: "box", w: P.legR * 1.7, h: 0.08, d: P.legR * 2.6 + 0.08, col: 0x2a211b } },

  const head = { name: "head", p: [0, P.headY, 0], c: [
    { m: { t: "sphere", r: P.headR, s: [1, 1.05, 1], col: SKIN } },
    // silmät ja nenä

  ] };
  if (P.hair) { // hiukset: kupoli päälaella, kallistettu taaksepäin
    head.c.push({ p: [0, P.headR * 0.08, P.headR * 0.06], r: [0.4, 0, 0], m: { t: "sphere", r: P.headR * 1.07, cap: 0.5, col: P.hair } });

  if (P.chin === 2) { // kaksoisleuka

    head.c.push({ p: [0, -P.headR * 1.08, -P.headR * 0.12], m: { t: "sphere", r: P.headR * 0.62, s: [1.35, 0.5, 1.05], col: SKIN } });

      head.c.push({ p: [s * P.headR * 0.8, P.headR * 0.18, -P.headR * 0.5], m: { t: "box", w: 0.008, h: 0.008, d: P.headR * 0.95, col: 0x111111 } });

    { p: [0, P.belly.y, P.belly.z], m: { t: "sphere", r: P.belly.r, s: [1.05, 0.95, 1], col: shirt } },

  }
  return { c: [leg(-1), leg(1), body] };
}

const _matCache = new Map();
function mat(col) {
  if (!_matCache.has(col)) _matCache.set(col, new THREE.MeshStandardMaterial({ color: col, roughness: 0.8 }));
  return _matCache.get(col);
}
function buildNode(spec, parts) {
  const g = new THREE.Group();
  if (spec.p) g.position.set(...spec.p);
  if (spec.r) g.rotation.set(...spec.r);
  if (spec.name) parts[spec.name] = g;
  const m = spec.m;
  if (m) {
    let geo;
    if (m.t === "sphere") geo = m.cap ? new THREE.SphereGeometry(m.r, 20, 12, 0, Math.PI * 2, 0, Math.PI * m.cap) : new THREE.SphereGeometry(m.r, 20, 14);
    else if (m.t === "capsule") geo = new THREE.CapsuleGeometry(m.r, m.l, 6, 14);
    else if (m.t === "box") geo = new THREE.BoxGeometry(m.w, m.h, m.d);
    else if (m.t === "cyl") geo = new THREE.CylinderGeometry(m.r1, m.r2, m.h, 16);
    else if (m.t === "torus") geo = new THREE.TorusGeometry(m.r, m.tube, 6, 18);
    const mesh = new THREE.Mesh(geo, mat(m.col));
    if (m.s) mesh.scale.set(...m.s);
    mesh.castShadow = true;
    g.add(mesh);
  }
  for (const child of spec.c || []) g.add(buildNode(child, parts));
  return g;
}

function buildCharacter(kind, color) {
  const parts = {};
  const root = buildNode(charSpec(kind, new THREE.Color(color).getHex()), parts);
  // Lähtöasennot animaatiota varten
  parts.base = { bodyY: parts.body.position.y, armLz: parts.armL.rotation.z, armRz: parts.armR.rotation.z };
  return { root, parts, phase: 0, speed: 0, deadT: 0, last: null };
}

// Animaatio: kävely nopeuden mukaan, hyppy, tähtäys ja kaatuminen
function animateCharacter(ch, kind, state, dt, now) {
  const c = CLASSES[kind] || CLASSES.sotilas;
  const { parts } = ch;
  const last = ch.last || state;
  const vx = (state.x - last.x) / Math.max(dt, 1e-3), vz = (state.z - last.z) / Math.max(dt, 1e-3), vy = (state.y - last.y) / Math.max(dt, 1e-3);
  ch.last = { x: state.x, y: state.y, z: state.z };
  const horiz = Math.min(Math.hypot(vx, vz), c.speed * 1.5);
  ch.speed += (horiz - ch.speed) * Math.min(1, dt * 10); // pehmennys
  const inAir = Math.abs(vy) > 0.8;

  // Kaatuminen
  if (!state.alive) {
    ch.deadT += dt;
    ch.root.rotation.x = Math.min(1, ch.deadT * 3.5) * (Math.PI / 2);
    return;
  }
  ch.deadT = 0;
  ch.root.rotation.x = 0;

  const legLen = parts.base.bodyY;
  const heavy = kind === "panssari";
  const stride = legLen * (heavy ? 1.0 : 1.3);
  ch.phase += (ch.speed / stride) * dt * Math.PI;
  const amp = Math.min(1, ch.speed / (c.speed * 0.6)) * (kind === "vikkela" ? 0.75 : heavy ? 0.5 : 0.6);
  const sw = Math.sin(ch.phase);

  if (inAir) {
    parts.legL.rotation.x = 0.55; parts.legR.rotation.x = -0.25;
    parts.armL.rotation.x = -0.6;
  } else {
    parts.legL.rotation.x = sw * amp;
    parts.legR.rotation.x = -sw * amp;
    parts.armL.rotation.x = -sw * amp * 0.9;
  }
  // Lataus: vasen käsi tuo uuden lippaan aseeseen
  if (state.reloading) {
    parts.armL.rotation.x = 1.15 + state.pitch * 0.8 + Math.sin(now / 90) * 0.12;
    parts.armL.rotation.z = 0.65;
  } else {
    parts.armL.rotation.z = parts.base.armLz;
  }
  // Oikea käsi tähtää katseen suuntaan
  parts.armR.rotation.x = Math.PI / 2 + state.pitch;
  parts.armR.rotation.z = parts.base.armRz * 0.3;
  parts.head.rotation.x = state.pitch * 0.45;

  // Vartalo: pomppii askelissa, Jari keinuu sivuttain, levossa hengitys
  const breathe = Math.sin(now / 600) * 0.012;
  parts.body.position.y = parts.base.bodyY + Math.abs(sw) * 0.035 * amp;
  parts.body.rotation.z = heavy ? sw * 0.09 * amp : sw * 0.03 * amp;
  parts.body.rotation.x = -ch.speed / c.speed * (kind === "vikkela" ? 0.12 : 0.05); // nojaus eteenpäin juostessa
  parts.body.scale.set(1 + breathe * 0.5, 1 + breathe, 1 + breathe * 0.5);
}

function makeAvatar(p) {
  const c = CLASSES[p.k] || CLASSES.sotilas;
  const ch = buildCharacter(p.k, p.c);
  const group = new THREE.Group();
  group.add(ch.root);

  // Nimi pään yläpuolelle
  const cv = document.createElement("canvas");
  cv.width = 256; cv.height = 64;
  const g = cv.getContext("2d");
  g.font = "bold 34px system-ui, sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.lineWidth = 6; g.strokeStyle = "rgba(0,0,0,.7)"; g.strokeText(p.n, 128, 32);
  g.fillStyle = "#fff"; g.fillText(p.n, 128, 32);
  const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthWrite: false }));
  label.scale.set(1.6, 0.4, 1);
  label.position.y = c.height + 0.35;
  group.add(label);

  scene.add(group);
  return { group, ch, label, k: p.k, n: p.n };
}

function removeAvatar(av) {
  scene.remove(av.group);
  av.label.material.map.dispose();
  av.label.material.dispose();
  av.group.traverse((o) => o.geometry?.dispose?.()); // materiaalit jaetaan hahmojen kesken
}

function makePortraits() {
  const size = 160, cam = new THREE.PerspectiveCamera(32, 1, 0.1, 20);
  preview.renderer.setSize(size, size);
  for (const kind of Object.keys(CLASSES)) {
    const ch = buildCharacter(kind, "#b0473a");

    ch.root.rotation.y = 0.45;
    preview.scene.add(ch.root);
    const H = CLASSES[kind].height;

    preview.renderer.render(preview.scene, cam);
    try { portraits[kind] = preview.renderer.domElement.toDataURL("image/png"); } catch {}

function previewFrame(dt, now) {
  // Koko seuraa valikon kokoa
  const box = $("preview");
  const w = box.clientWidth, h = box.clientHeight;
  if (w && h && (w !== preview.w || h !== preview.h)) {
    preview.w = w; preview.h = h;
    preview.renderer.setSize(w, h);
    preview.camera.aspect = w / h;
    preview.camera.updateProjectionMatrix();
  }
  const kind = shownClass();
  if (preview.kind !== kind) {
    if (preview.ch) preview.scene.remove(preview.ch.root);
    preview.kind = kind;
    preview.ch = buildCharacter(kind, "#b0473a");
    preview.scene.add(preview.ch.root);
  }
  // Seisoo ja hengittää, kääntyilee hitaasti puolelta toiselle
  preview.camera.position.set(0, 1.05, -5.2);
  preview.camera.lookAt(0, 0.98, 0);
  animateCharacter(preview.ch, kind, { x: 0, y: 0, z: 0, pitch: -0.75, alive: true }, dt, now);
  preview.ch.root.rotation.y = 0.35 + Math.sin(now / 1800) * 0.45;
  preview.renderer.render(preview.scene, preview.camera);
}

// ====== Laukausten jäljet ======
const tracers = [];
function addTracer(from, to, color = 0xfff2b0) {
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...from), new THREE.Vector3(...to)]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.9 }));
  scene.add(line);
  tracers.push({ line, born: performance.now() });
}
function updateTracers(now) {
  for (let i = tracers.length - 1; i >= 0; i--) {
    const t = tracers[i], age = now - t.born;
    t.line.material.opacity = Math.max(0, 0.9 - age / 120);
    if (age > 120) { scene.remove(t.line); t.line.geometry.dispose(); t.line.material.dispose(); tracers.splice(i, 1); }
  }
}

// ====== Äänet (pienet syntetisoidut äänet, ei tiedostoja) ======
let audio = null;
function sound(kind) {
  try {
    audio = audio || new AudioContext();
    const t = audio.currentTime;
    if (kind === "magOut" || kind === "magIn" || kind === "rack") {
      // Latauksen äänet: lyhyitä metallisia napsahduksia
      const len = kind === "rack" ? 0.16 : 0.07;
      const buf = audio.createBuffer(1, audio.sampleRate * len, audio.sampleRate), data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const e = Math.pow(1 - i / data.length, kind === "rack" ? 1.5 : 4);
        data[i] = (Math.random() * 2 - 1) * e * (kind === "rack" && i > data.length * 0.45 && i < data.length * 0.55 ? 2 : 1);
      }
      const src = audio.createBufferSource(), f = audio.createBiquadFilter(), gn = audio.createGain();
      src.buffer = buf; f.type = "bandpass";
      f.frequency.value = kind === "magOut" ? 1800 : kind === "magIn" ? 2600 : 3400; f.Q.value = 3;
      gn.gain.value = kind === "magIn" ? 0.6 : 0.45;
      src.connect(f).connect(gn).connect(audio.destination); src.start(t);
    } else if (kind === "shot") {
      const len = 0.12, buf = audio.createBuffer(1, audio.sampleRate * len, audio.sampleRate), data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3);
      const src = audio.createBufferSource(), f = audio.createBiquadFilter(), gn = audio.createGain();
      src.buffer = buf; f.type = "lowpass"; f.frequency.value = 2200; gn.gain.value = 0.35;
      src.connect(f).connect(gn).connect(audio.destination); src.start(t);
    } else {
      const o = audio.createOscillator(), gn = audio.createGain();
      o.type = kind === "hurt" ? "sawtooth" : "square";
      o.frequency.value = kind === "kill" ? 1320 : kind === "hurt" ? 140 : 880;
      gn.gain.setValueAtTime(kind === "hurt" ? 0.12 : 0.07, t);
      gn.gain.exponentialRampToValueAtTime(0.001, t + (kind === "kill" ? 0.25 : 0.09));
      o.connect(gn).connect(audio.destination); o.start(t); o.stop(t + 0.3);
    }
  } catch {}
}

// ====== Oma pelaaja ja fysiikka ======
const me = { x: 0, y: 0, z: 0, vy: 0, yaw: 0, pitch: 0, grounded: true, cls: CLASSES.sotilas, hp: 250, alive: true };
const keys = {};
let jumpQueued = false; // lyhytkin välilyönnin napautus hyppää

function overlapsXZ(x, z, b, r) {
  return x + r > b.minX && x - r < b.maxX && z + r > b.minZ && z - r < b.maxZ;
}
function overlaps(x, y, z, b, r, h) {
  return overlapsXZ(x, z, b, r) && y < b.maxY && y + h > b.minY;
}

// Liikutetaan yhtä akselia kerrallaan ja työnnetään pois laatikoista
function moveAxis(axis, delta) {
  const r = me.cls.radius, h = me.cls.height;
  me[axis] += delta;
  for (const b of BOXES) {
    if (!overlaps(me.x, me.y, me.z, b, r, h)) continue;
    // Matala este (porras): noustaan sen päälle, jos yläpuolella on tilaa
    if (b.maxY - me.y <= STEP && me.grounded && !BOXES.some((o) => o !== b && overlaps(me.x, b.maxY, me.z, o, r, h))) {
      me.y = b.maxY;
      continue;
    }
    if (axis === "x") me.x = delta > 0 ? b.minX - r - 1e-4 : b.maxX + r + 1e-4;
    else me.z = delta > 0 ? b.minZ - r - 1e-4 : b.maxZ + r + 1e-4;
  }
  const lim = (axis === "x" ? ARENA_X : ARENA_Z) - r;
  me[axis] = Math.max(-lim, Math.min(lim, me[axis]));
}

function physics(dt) {
  const c = me.cls;
  let f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  let s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const len = Math.hypot(f, s) || 1;
  f /= len; s /= len;
  const sin = Math.sin(me.yaw), cos = Math.cos(me.yaw);
  moveAxis("x", (-sin * f + cos * s) * c.speed * dt);
  moveAxis("z", (-cos * f - sin * s) * c.speed * dt);

  if ((keys.Space || jumpQueued) && me.grounded) { me.vy = c.jump; me.grounded = false; }
  jumpQueued = false;
  me.vy -= GRAVITY * dt;
  const newY = me.y + me.vy * dt;
  me.grounded = false;
  // Alla oleva lattia ja yllä oleva katto
  let ground = 0, ceiling = Infinity;
  for (const b of BOXES) {
    if (!overlapsXZ(me.x, me.z, b, c.radius)) continue;
    if (me.y >= b.maxY - 1e-3) ground = Math.max(ground, b.maxY);
    else if (me.y + c.height <= b.minY + 1e-3) ceiling = Math.min(ceiling, b.minY);
  }
  if (newY <= ground) { me.y = ground; me.vy = 0; me.grounded = true; }
  else if (newY + c.height > ceiling) { me.y = ceiling - c.height; me.vy = 0; }
  else me.y = newY;
}

// Säde vs. laatikko (sama kuin palvelimella)
function rayBox(o, d, min, max) {
  let tmin = 0, tmax = Infinity;
  for (let i = 0; i < 3; i++) {
    if (Math.abs(d[i]) < 1e-9) { if (o[i] < min[i] || o[i] > max[i]) return null; }
    else {
      let t1 = (min[i] - o[i]) / d[i], t2 = (max[i] - o[i]) / d[i];
      if (t1 > t2) [t1, t2] = [t2, t1];
      tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
      if (tmin > tmax) return null;
    }
  }
  return tmin;
}

// ====== Hiiri ja näppäimet ======
const canvas = renderer.domElement;
let joined = false, firing = false;
function locked() { return document.pointerLockElement === canvas; }
$("pause").onclick = () => canvas.requestPointerLock();
canvas.addEventListener("click", () => { if (joined && !locked()) canvas.requestPointerLock(); });
document.addEventListener("pointerlockchange", updateOverlays);
document.addEventListener("mousemove", (e) => {
  if (!locked()) return;
  me.yaw -= e.movementX * SENS;
  me.pitch = Math.max(-1.55, Math.min(1.55, me.pitch - e.movementY * SENS));
});
document.addEventListener("mousedown", (e) => { if (e.button === 0 && locked()) firing = true; });
document.addEventListener("mouseup", (e) => { if (e.button === 0) firing = false; });
addEventListener("keydown", (e) => {
  if (!joined) return;
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === "Space") jumpQueued = true;
  if (e.code === "KeyR" && me.alive) startReload(true);
});
addEventListener("keyup", (e) => { keys[e.code] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; firing = false; });
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function updateOverlays() {
  const playing = joined && locked();
  $("pause").style.display = joined && !locked() && me.alive ? "flex" : "none";
  $("cross").style.display = playing && me.alive ? "block" : "none";
  $("health").style.display = joined ? "block" : "none";
  $("ammo").style.display = joined ? "block" : "none";
  viewGun.visible = joined && me.alive;
  if (!locked()) { for (const k in keys) keys[k] = false; firing = false; }
}

// ====== Elämäplussa ======
function updateHealth() {
  const max = me.cls.hp || 1;
  const hp = Math.max(0, me.hp);
  const frac = Math.min(1, hp / max);
  const low = hp < 50;
  // Täyttö laskee alhaalta ylöspäin elämien mukaan (plussa ulottuu y = 6...114)
  const top = 114 - 108 * frac;
  const fill = $("hpfill");
  fill.setAttribute("y", top);
  fill.setAttribute("height", 120 - top);
  fill.setAttribute("fill", low ? "url(#red)" : "url(#beige)");
  $("hpoutline").setAttribute("stroke", low ? "#7a0d08" : "#2a2622");
  $("hpnum").textContent = Math.ceil(hp);
  // Numero tummana täytön päällä, vaaleana tyhjän päällä
  const textOnFill = top < 50;
  $("hpnum").setAttribute("fill", low ? "#fbe9e4" : textOnFill ? "#5a5247" : "#efe6cf");
  $("health").classList.toggle("low", low && me.alive);
}

// ====== Verkko ======
let ws = null, myId = null, roomName = "";
let snapshots = [];
const avatars = new Map();
let lastView = { players: new Map(), sa: 0, sb: 0, t: 1 };
let respawnAt = 0;

function join() {
  const name = $("name").value.trim() || "Pelaaja";
  roomName = ($("room").value.trim() || "aula").toLowerCase();
  try { localStorage.setItem("pallopeli-nimi", name); localStorage.setItem("areena-hahmo", chosenClass); } catch {}
  const u = new URL(location.href);
  u.searchParams.set("room", roomName);
  history.replaceState(null, "", u);

  $("msg").textContent = "Yhdistetään…";
  snapshots = [];
  ws = new WebSocket(`${SERVER}/ws?room=${encodeURIComponent(roomName)}&name=${encodeURIComponent(name)}&cls=${chosenClass}`);

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    switch (msg.type) {
      case "welcome":
        myId = msg.id;
        for (const k in msg.classes) Object.assign(CLASSES[k] ||= { name: k, desc: "", stats: [0.5, 0.5] }, msg.classes[k]);
        WEAPON = { ...WEAPON, ...msg.weapon }; // puuttuvat arvot oletuksista
        if (msg.gravity) GRAVITY = msg.gravity;
        if (!msg.weapon.mag) console.warn("Palvelin on vanha versio: aja server-kansiossa npx wrangler deploy");
        buildWorld(msg.map);
        me.cls = CLASSES[chosenClass];
        Object.assign(me, msg.spawn, { vy: 0, pitch: 0, grounded: true, hp: me.cls.hp, alive: true });
        resetAmmo();
        joined = true;
        $("msg").textContent = "";
        $("lobby").style.display = "none";
        $("copy").style.display = "block";
        canvas.requestPointerLock?.();
        updateOverlays(); updateHealth();
        break;
      case "state":
        snapshots.push({ time: performance.now(), seq: msg.seq, players: new Map(msg.players.map((p) => [p.id, p])) });
        if (snapshots.length > 30) snapshots.shift();
        { const mine = msg.players.find((p) => p.id === myId); if (mine && mine.a) { me.hp = mine.h; updateHealth(); } }
        break;
      case "correct":
        Object.assign(me, { x: msg.x, y: msg.y, z: msg.z, vy: 0 });
        break;
      case "shot": {
        // Toisen pelaajan laukaus: jälki aseen kohdalta osumakohtaan
        const o = [msg.o[0], msg.o[1] - 0.3, msg.o[2]];
        addTracer(o, msg.e);
        break;
      }
      case "hit":
        if (msg.at) addDamageNumber(msg.dmg, msg.at);
        flashCross(msg.kill);
        sound(msg.kill ? "kill" : "hit");
        break;
      case "hurt":
        me.hp = Math.max(0, me.hp - msg.dmg);
        updateHealth();
        $("hurt").style.transition = "none"; $("hurt").style.opacity = 1;
        requestAnimationFrame(() => { $("hurt").style.transition = "opacity .5s"; $("hurt").style.opacity = 0; });
        sound("hurt");
        break;
      case "kill":
        addFeed(msg);
        if (msg.victimId === myId) {
          me.alive = false; me.hp = 0; firing = false;
          resetAmmo();
          respawnAt = performance.now() + 3000;
          $("deadText").innerHTML = `<span style="color:${msg.kc}">${esc(msg.killer)}</span> tyrmäsi sinut`;
          $("dead").style.display = "flex";
          updateOverlays(); updateHealth();
        }
        break;
      case "respawn":
        Object.assign(me, msg.spawn, { vy: 0, pitch: 0, grounded: true, hp: msg.hp, alive: true });
        resetAmmo();
        $("dead").style.display = "none";
        updateOverlays(); updateHealth();
        break;
      case "full":
        $("msg").textContent = "Huone on täynnä. Kokeile toista huonetta.";
        break;
    }
  };

  ws.onclose = () => {
    if (joined) $("msg").textContent = "Yhteys katkesi. Liity uudelleen.";
    else if ($("msg").textContent === "Yhdistetään…") $("msg").textContent = "Palvelimeen ei saatu yhteyttä (" + SERVER + ").";
    joined = false; myId = null;
    $("lobby").style.display = "flex";
    $("dead").style.display = "none";
    $("copy").style.display = "none";
    document.exitPointerLock?.();
    for (const av of avatars.values()) removeAvatar(av);
    avatars.clear();
    updateOverlays();
  };
}

let lastSend = 0, lastSent = "";
function sendMove(now) {
  if (!ws || ws.readyState !== WebSocket.OPEN || !me.alive || now - lastSend < SEND_MS) return;
  lastSend = now;
  const msg = JSON.stringify({ type: "move", x: +me.x.toFixed(2), y: +me.y.toFixed(2), z: +me.z.toFixed(2), yaw: +me.yaw.toFixed(3), pitch: +me.pitch.toFixed(3) });
  if (msg !== lastSent) { ws.send(msg); lastSent = msg; } // paikallaan seistessä ei lähetetä mitään
}

// ====== Ampuminen ======
let lastShot = 0, recoil = 0;
let ammo = 10, reloading = false, reloadStart = 0, reloadSounds = [];
function resetAmmo() {
  ammo = WEAPON.mag; reloading = false;
  reloadSounds.forEach(clearTimeout); reloadSounds = [];
  updateAmmo(0);
}
function startReload(manual) {
  if (reloading || ammo >= WEAPON.mag || !joined) return;
  reloading = true;
  reloadStart = performance.now();
  if (manual && ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "reload" }));
  // Äänet animaation tahdissa: lipas ulos, uusi lipas sisään, luisti taakse
  const R = WEAPON.reloadMs;
  reloadSounds = [setTimeout(() => sound("magOut"), R * 0.15), setTimeout(() => sound("magIn"), R * 0.55), setTimeout(() => sound("rack"), R * 0.82)];
  updateAmmo(performance.now());
}
function updateAmmo(now) {
  if (reloading && now - reloadStart >= WEAPON.reloadMs) { reloading = false; ammo = WEAPON.mag; }
  $("ammoNum").textContent = ammo;
  $("ammoMax").textContent = "/ " + WEAPON.mag;
  $("ammoName").textContent = reloading ? "Ladataan…" : WEAPON.name;
  $("ammo").classList.toggle("empty", ammo === 0);
  $("ammo").classList.toggle("reloading", reloading);
  $("reloadBar").style.width = reloading ? Math.min(100, ((now - reloadStart) / WEAPON.reloadMs) * 100) + "%" : "0";
}
function eyePos() { return [me.x, me.y + me.cls.height * 0.9, me.z]; }
function aimDir() {
  const cp = Math.cos(me.pitch);
  return [-Math.sin(me.yaw) * cp, Math.sin(me.pitch), -Math.cos(me.yaw) * cp];
}

function shoot(now) {
  if (reloading || ammo <= 0) return;
  lastShot = now;
  ammo--;
  const o = eyePos(), d = aimDir();
  ws.send(JSON.stringify({
    type: "shoot",
    o: o.map((v) => +v.toFixed(3)), d: d.map((v) => +v.toFixed(4)),
    sa: lastView.sa, sb: lastView.sb, t: +lastView.t.toFixed(3), // mitä näin ruudulla
  }));

  // Oma jälki heti (osumat ratkaisee palvelin)
  let dist = WEAPON.range;
  for (const b of BOXES) { const t = rayBox(o, d, [b.minX, b.minY, b.minZ], [b.maxX, b.maxY, b.maxZ]); if (t !== null && t < dist) dist = t; }
  if (d[1] < 0) dist = Math.min(dist, -o[1] / d[1]);
  for (const p of lastView.players.values()) {
    if (p.id === myId || !p.a) continue;
    const c = CLASSES[p.k] || CLASSES.sotilas;
    const t = rayBox(o, d, [p.x - c.radius, p.y, p.z - c.radius], [p.x + c.radius, p.y + c.height, p.z + c.radius]);
    if (t !== null && t < dist) dist = t;
  }
  const muzzleWorld = new THREE.Vector3(0, 0.035, -0.34);
  viewGun.localToWorld(muzzleWorld);
  addTracer([muzzleWorld.x, muzzleWorld.y, muzzleWorld.z], o.map((v, i) => v + d[i] * dist));

  recoil = 1;
  muzzle.visible = true;
  setTimeout(() => (muzzle.visible = false), 45);
  sound("shot");
  if (ammo === 0) setTimeout(() => startReload(false), 120); // automaattinen lataus
  updateAmmo(now);
}

// ====== Vahinkonumerot: punainen "-N" nousee osumakohdasta ja häviää ======
const damageNumbers = [];
function addDamageNumber(dmg, at) {
  const el = document.createElement("div");
  el.className = "dmg";
  el.textContent = "-" + dmg;
  document.body.appendChild(el);
  damageNumbers.push({ el, pos: [at[0] + (Math.random() - 0.5) * 0.4, at[1] + 0.2, at[2] + (Math.random() - 0.5) * 0.4], born: performance.now() });
}
const _v = new THREE.Vector3();
function updateDamageNumbers(now) {
  for (let i = damageNumbers.length - 1; i >= 0; i--) {
    const d = damageNumbers[i], age = (now - d.born) / 1000;
    if (age > 1.1) { d.el.remove(); damageNumbers.splice(i, 1); continue; }
    _v.set(d.pos[0], d.pos[1] + age * 0.9, d.pos[2]).project(camera); // nousee ylöspäin
    const visible = _v.z < 1;
    d.el.style.display = visible ? "block" : "none";
    d.el.style.left = ((_v.x + 1) / 2) * innerWidth + "px";
    d.el.style.top = ((1 - _v.y) / 2) * innerHeight + "px";
    d.el.style.opacity = Math.min(1, 1.6 - age * 1.45);
    d.el.style.transform = `translate(-50%, -50%) scale(${age < 0.08 ? 1.4 - age * 5 : 1})`;
  }
}

let crossTimer = 0;
function flashCross(kill) {
  $("cross").classList.add("hit");
  clearTimeout(crossTimer);
  crossTimer = setTimeout(() => $("cross").classList.remove("hit"), kill ? 350 : 140);
}

function addFeed(msg) {
  const el = document.createElement("div");
  el.innerHTML = `<span style="color:${msg.kc}">${esc(msg.killer)}</span> ⨯ <span style="color:${msg.vc}">${esc(msg.victim)}</span>`;
  $("feed").prepend(el, document.createElement("br"));
  setTimeout(() => { el.nextSibling?.remove(); el.remove(); }, 5000);
}

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $("copy").textContent = "Linkki kopioitu!"; }
  catch { prompt("Kopioi linkki:", location.href); }
  setTimeout(() => ($("copy").textContent = "Kopioi huoneen linkki"), 1500);
};

// ====== Muiden pelaajien interpoloitu tila ======
function lerpAngle(a, b, t) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
function currentView() {
  if (snapshots.length === 0) return { players: new Map(), sa: 0, sb: 0, t: 1 };
  const renderTime = performance.now() - INTERP_DELAY;
  let i = snapshots.length - 1;
  while (i > 0 && snapshots[i - 1].time > renderTime) i--;
  const b = snapshots[i], a = snapshots[i - 1];
  if (!a || renderTime >= b.time) return { players: b.players, sa: b.seq, sb: b.seq, t: 1 };
  const t = Math.max(0, Math.min(1, (renderTime - a.time) / (b.time - a.time)));
  const out = new Map();
  for (const [id, pb] of b.players) {
    const pa = a.players.get(id);
    out.set(id, pa && pa.a === pb.a ? { ...pb, x: pa.x + (pb.x - pa.x) * t, y: pa.y + (pb.y - pa.y) * t, z: pa.z + (pb.z - pa.z) * t, yw: lerpAngle(pa.yw, pb.yw, t), p: pa.p + (pb.p - pa.p) * t } : pb);
  }
  return { players: out, sa: a.seq, sb: b.seq, t };
}

// ====== Pelisilmukka ======
let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  lastView = currentView();

  if (joined) {
    if (locked() && me.alive) physics(dt);
    sendMove(now);
    if (firing && me.alive && locked() && now - lastShot >= WEAPON.cooldownMs) shoot(now);
    if (!me.alive) $("deadTimer").textContent = `Synnyt uudelleen ${Math.max(0, Math.ceil((respawnAt - now) / 1000))} s kuluttua`;
  }

  camera.position.set(me.x, me.y + me.cls.height * 0.9, me.z);
  camera.rotation.set(me.pitch, me.yaw, 0);

  // Aseen rekyyli ja pieni heilunta kävellessä
  recoil = Math.max(0, recoil - dt * 9);
  const moving = joined && (keys.KeyW || keys.KeyA || keys.KeyS || keys.KeyD) && me.grounded;
  const bob = moving ? Math.sin(now / 90) * 0.008 : 0;
  viewGun.position.set(GUN_POS.x, GUN_POS.y + bob + recoil * 0.02, GUN_POS.z + recoil * 0.06);
  viewGun.rotation.set(recoil * 0.25, 0, 0);

  // Latausanimaatio: ase kallistuu, vasen käsi tuo lippaan ja lyö sen sisään
  if (joined) updateAmmo(now);
  viewHand.visible = reloading && me.alive;
  if (reloading) {
    const r = Math.min(1, (now - reloadStart) / WEAPON.reloadMs);
    const tilt = Math.sin(Math.min(1, r * 1.15) * Math.PI);           // ase kallistuu ja palaa
    viewGun.rotation.set(0.35 * tilt, 0.15 * tilt, 0.55 * tilt);
    viewGun.position.y -= 0.05 * tilt;
    // käsi: 0-0.3 tulee esiin, 0.3-0.5 vie lippaan kahvan alle, 0.5-0.6 lyö sisään, 0.6-1 poistuu
    const k = r < 0.5 ? Math.min(1, r / 0.45) : r < 0.62 ? 1 : Math.max(0, 1 - (r - 0.62) / 0.3);
    const ease = k * k * (3 - 2 * k);
    viewHand.position.lerpVectors(HAND_REST, HAND_GUN, ease);
    if (r > 0.5 && r < 0.6) viewHand.position.y += 0.03 * Math.sin(((r - 0.5) / 0.1) * Math.PI); // napautus ylös
    viewHand.position.y -= 0.05 * tilt * ease;
    viewHand.rotation.set(0.2, 0, 0.5 * tilt);
    viewHand.userData.mag.visible = r < 0.58; // lipas jää aseeseen
  }

  // Muut pelaajat
  const view = lastView.players;
  for (const [id, av] of avatars) {
    if (!view.has(id) || id === myId) { removeAvatar(av); avatars.delete(id); }
  }
  for (const [id, p] of view) {
    if (id === myId) continue;
    let av = avatars.get(id);
    if (av && (av.k !== p.k || av.n !== p.n)) { removeAvatar(av); avatars.delete(id); av = null; }
    if (!av) { av = makeAvatar(p); avatars.set(id, av); }
    av.group.position.set(p.x, p.y, p.z);
    av.group.rotation.y = p.yw;
    av.label.visible = !!p.a;
    animateCharacter(av.ch, p.k, { x: p.x, y: p.y, z: p.z, pitch: p.p, alive: !!p.a, reloading: !!p.rl }, dt, now);
  }
  updateTracers(now);
  updateDamageNumbers(now);

  // HUD
  if (joined) {
    $("info").textContent = `Huone: ${roomName} · ${me.cls.name} · pelaajia ${view.size}`;
    const sorted = [...view.values()].sort((a, b) => b.kl - a.kl || a.de - b.de);
    $("list").innerHTML = sorted.map((p) =>
      `<div><span style="color:${p.c}">●</span> ${esc(p.n)} <span style="color:#aab">(${esc(CLASSES[p.k]?.name || "")})</span>${p.id === myId ? " · sinä" : ""} <span class="kd">${p.kl} / ${p.de}</span></div>`).join("");
  } else { $("info").textContent = ""; $("list").innerHTML = ""; }

  renderer.render(scene, camera);
  if (!joined) previewFrame(dt, now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
updateOverlays();

// Testausta varten: window.areena konsolissa
window.areena = { me, keys, physics, charSpec, get view() { return lastView; }, get boxes() { return BOXES; } };
</script>
</body>
</html>
