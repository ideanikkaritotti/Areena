<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Areena</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><circle cx='5' cy='5' r='4' fill='%23e6194b'/></svg>">
<style>
  html, body { margin: 0; height: 100%; background: #0e1014; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; user-select: none; }
  canvas { display: block; }
  #hud { position: fixed; top: 10px; left: 12px; font-size: 14px; line-height: 1.5; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #list { position: fixed; top: 10px; right: 12px; font-size: 14px; line-height: 1.6; text-align: right; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #cross { position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none; display: none; }
  #cross::before, #cross::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
  #cross::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #cross::after { top: 8px; left: 0; height: 2px; width: 18px; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,10,14,.82); }
  .card { background: #1d2129; padding: 26px 30px; border-radius: 12px; width: min(560px, 92vw); box-shadow: 0 10px 40px #0009; }
  .card h1 { margin: 0 0 6px; font-size: 28px; }
  .card .sub { color: #99a; font-size: 14px; margin-bottom: 14px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  label { display: block; font-size: 13px; color: #aab; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #3a4050; background: #12151b; color: #eee; }
  .classes { display: flex; gap: 10px; margin-top: 4px; }
  .cls { flex: 1; border: 2px solid #343a48; border-radius: 10px; padding: 10px; cursor: pointer; background: #161a21; }
  .cls:hover { border-color: #56607a; }
  .cls.sel { border-color: #e6194b; background: #24161b; }
  .cls b { display: block; font-size: 16px; margin-bottom: 4px; }
  .cls small { color: #aab; font-size: 12px; line-height: 1.4; display: block; }
  .bar { height: 5px; background: #2c3240; border-radius: 3px; margin: 3px 0 6px; }
  .bar i { display: block; height: 100%; background: #e6194b; border-radius: 3px; }
  button.big { margin-top: 18px; width: 100%; padding: 12px; font-size: 16px; font-weight: 600; border: 0; border-radius: 6px; background: #e6194b; color: #fff; cursor: pointer; }
  button.big:hover { background: #f03a63; }
  #msg { color: #f88; font-size: 14px; margin-top: 10px; min-height: 1em; }
  .hint { font-size: 12px; color: #889; margin-top: 10px; line-height: 1.5; }
  #pause .card { text-align: center; width: auto; cursor: pointer; }
  #copy { position: fixed; bottom: 12px; left: 12px; padding: 8px 12px; border: 0; border-radius: 6px; background: #2b3040; color: #ddd; cursor: pointer; display: none; }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="hud"></div>
<div id="list"></div>
<div id="cross"></div>
<button id="copy">Kopioi huoneen linkki</button>

<div id="lobby" class="overlay">
  <div class="card">
    <h1>Areena</h1>
    <div class="sub">Valitse hahmo ja liity huoneeseen. Samassa huoneessa olevat näkevät toisensa.</div>
    <div class="row">
      <div><label for="name">Nimesi</label><input id="name" maxlength="16" placeholder="esim. Totti"></div>
      <div><label for="room">Huone</label><input id="room" maxlength="16" placeholder="esim. testi"></div>
    </div>
    <label>Hahmo</label>
    <div class="classes" id="classes"></div>
    <button class="big" id="join">Liity peliin</button>
    <div id="msg"></div>
    <div class="hint">Ohjaus: WASD liikkuu, välilyönti hyppää, hiiri kääntää katsetta. Esc vapauttaa hiiren.</div>
  </div>
</div>

<div id="pause" class="overlay" style="display:none">
  <div class="card"><h1>Klikkaa pelataksesi</h1><div class="sub">Hiiri lukittuu peliin. Esc vapauttaa sen.</div></div>
</div>

<script type="module">
import * as THREE from "three";

// ====== ASETUS: oman Cloudflare-palvelimesi osoite ======
const PROD_SERVER = "wss://areena.pallopeli.workers.dev";
const isLocal = ["localhost", "127.0.0.1", ""].includes(location.hostname);
const SERVER = new URLSearchParams(location.search).get("server") || (isLocal ? "ws://localhost:8787" : PROD_SERVER);

// ====== Hahmot (nopeuden pitää olla sama kuin palvelimella) ======
const CLASSES = {
  // Avaimet (panssari/sotilas/vikkela) ovat sisäisiä tunnisteita, name näkyy pelaajille
  panssari: { name: "Jari",  desc: "Hidas ja iso. Kestää myöhemmin eniten osumia.", speed: 5.6, jump: 7.2, radius: 0.55, height: 2.0, stats: [0.45, 0.4, 1.0] },
  sotilas:  { name: "Juha",  desc: "Tasapainoinen kaikessa.", speed: 6.8, jump: 8.2, radius: 0.45, height: 1.8, stats: [0.65, 0.65, 0.65] },
  vikkela:  { name: "Jarmo", desc: "Nopea ja hyppää korkealle, mutta hauras.", speed: 8.3, jump: 9.6, radius: 0.38, height: 1.6, stats: [0.9, 1.0, 0.3] },
};

// ====== Kartta ======
// Areena: 60 m leveä (x) ja 120 m pitkä (z). Pelaajat syntyvät pitkien päätyjen lähelle.
const ARENA_X = 30, ARENA_Z = 60;

// Laatikko: [x, z, leveys, syvyys, korkeus, väri, pohjan korkeus]
const B = [];
const box = (x, z, w, d, h, color, y0 = 0) => B.push([x, z, w, d, h, color, y0]);
// Laatikko kulmapisteistä (helpompi seinille ja lattioille)
const rect = (x1, z1, x2, z2, y0, y1, color) => box((x1 + x2) / 2, (z1 + z2) / 2, x2 - x1, z2 - z1, y1 - y0, color, y0);
// Portaat: n askelmaa suuntaan (dx, dz), korkeudesta y0 korkeuteen y1
function stairs(x0, z0, dx, dz, width, y0, y1, n, depth, color) {
  for (let i = 1; i <= n; i++) {
    const cx = x0 + dx * depth * (i - 0.5), cz = z0 + dz * depth * (i - 0.5);
    box(cx, cz, dx ? depth : width, dz ? depth : width, (y1 - y0) * i / n, color, y0);
  }
}

// --- Keskitorni: 14 x 14 m, kolme tasoa (maantaso, 1. kerros, katto) ---
const WALL = 0x9ca3af, SLAB = 0x6b7280, STEPC = 0x8b8f99, F1 = 3.8, ROOF = 7.3;
// Maantason seinät, ovet pohjois- ja eteläpäädyissä
for (const s of [-1, 1]) {
  rect(-7, s * 7 - 0.2, -1.5, s * 7 + 0.2, 0, 3.5, WALL);
  rect(1.5, s * 7 - 0.2, 7, s * 7 + 0.2, 0, 3.5, WALL);
  rect(s * 7 - 0.2, -6.8, s * 7 + 0.2, 6.8, 0, 3.5, WALL);
}
box(2.5, 0, 1.5, 1.5, 1, 0xa16207); // suojalaatikko sisällä
// Portaat maasta 1. kerrokseen (länsiseinän vierellä, nousu +z-suuntaan)
stairs(-5.35, -3, 0, 1, 2.5, 0, F1, 8, 0.75, STEPC);
// 1. kerroksen lattia, jossa aukko portaiden kohdalla
rect(-7, -7, -4.1, -3.5, 3.5, F1, SLAB);
rect(-7, 3, -4.1, 7, 3.5, F1, SLAB);
rect(-7, -3.5, -6.6, 3, 3.5, F1, SLAB);
rect(-4.1, -7, 7, 7, 3.5, F1, SLAB);
// 1. kerros: matalat kaiteet, pilarit ja leveät ikkuna-aukot
for (const s of [-1, 1]) {
  rect(-7, s * 7 - 0.2, 7, s * 7 + 0.2, F1, F1 + 1.0, WALL);
  rect(s * 7 - 0.2, -6.8, s * 7 + 0.2, 6.8, F1, F1 + 1.0, WALL);
  for (const t of [-1, 1]) box(s * 6.5, t * 6.5, 1, 1, 7.0 - F1, WALL, F1);
  box(0, s * 6.5, 1, 1, 7.0 - F1, WALL, F1);
}
// Portaat 1. kerroksesta katolle (itäseinän vierellä, nousu -z-suuntaan)
stairs(5.35, 3, 0, -1, 2.5, F1, ROOF, 7, 0.8, STEPC);
// Katto, jossa aukko portaiden kohdalla
rect(-7, -7, 4.1, 7, 7.0, ROOF, SLAB);
rect(4.1, -7, 7, -2.6, 7.0, ROOF, SLAB);
rect(4.1, 3.5, 7, 7, 7.0, ROOF, SLAB);
rect(6.6, -2.6, 7, 3.5, 7.0, ROOF, SLAB);
// Katon kaiteet
for (const s of [-1, 1]) {
  rect(-7, s * 7 - 0.2, 7, s * 7 + 0.2, ROOF, ROOF + 1.0, WALL);
  rect(s * 7 - 0.2, -6.8, s * 7 + 0.2, 6.8, ROOF, ROOF + 1.0, WALL);
}

// --- Muu kenttä: sama puolikas peilataan toiselle puolelle, jotta päädyt ovat reilut ---
const MURU = 0x4b5563, CRATE = 0xa16207, CRATE2 = 0x92400e, PILLAR = 0x374151;
const half = [
  [-15, 0, 1, 8, 3, MURU],                                   // suojamuuri keskilinjalla
  [0, 20, 10, 1, 1.1, MURU],                                  // matala muuri (yli voi hypätä)
  [-12, 14, 2, 2, 1, CRATE], [12, 16, 2, 2, 1, CRATE], [-6, 26, 2, 2, 1, CRATE],
  [8, 30, 2, 2, 1, CRATE], [-18, 34, 2, 2, 1, CRATE], [20, 38, 2, 2, 1, CRATE],
  [20, 22, 3, 3, 2, CRATE2], [20, 24.5, 2, 2, 1, CRATE],     // laatikkopino: matalan kautta ylös
  [-20, 26, 3, 3, 2, CRATE2], [-20, 28.5, 2, 2, 1, CRATE],
  [0, 40, 12, 1, 3, MURU], [-15, 45, 1, 8, 3, MURU], [15, 45, 1, 8, 3, MURU],
  [-8, 36, 1.5, 1.5, 4, PILLAR], [10, 48, 1.5, 1.5, 4, PILLAR], [-22, 18, 1.5, 1.5, 4, PILLAR], [22, 30, 1.5, 1.5, 4, PILLAR],
];
for (const [x, z, w, d, h, c] of half) {
  box(x, z, w, d, h, c);
  if (x !== 0 || z !== 0) box(-x, -z, w, d, h, c); // peilikuva toiseen päätyyn
}

const BOXES = B.map(([x, z, w, d, h, color, y0]) => ({
  minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, minY: y0, maxY: y0 + h, color, x, z, w, d, h,
}));

const GRAVITY = 25;
const STEP = 0.55;          // näin korkealle noustaan ilman hyppyä (portaat)
const SEND_MS = 50;         // oma sijainti palvelimelle 20 krt/s
const INTERP_DELAY = 100;   // muut pelaajat näytetään 100 ms viiveellä, sulavasti
const SENS = 0.0022;        // hiiren herkkyys

// ====== Lobby ======
const $ = (id) => document.getElementById(id);
let chosenClass = "sotilas";
try { chosenClass = localStorage.getItem("areena-hahmo") || chosenClass; } catch {}
if (!CLASSES[chosenClass]) chosenClass = "sotilas";

function renderClasses() {
  const labels = ["Nopeus", "Hyppy", "Koko"];
  $("classes").innerHTML = Object.entries(CLASSES).map(([key, c]) => `
    <div class="cls ${key === chosenClass ? "sel" : ""}" data-k="${key}">
      <b>${c.name}</b>
      ${c.stats.map((v, i) => `<small>${labels[i]}</small><div class="bar"><i style="width:${v * 100}%"></i></div>`).join("")}
      <small>${c.desc}</small>
    </div>`).join("");
  for (const el of document.querySelectorAll(".cls")) el.onclick = () => { chosenClass = el.dataset.k; renderClasses(); };
}
renderClasses();

const params = new URLSearchParams(location.search);
$("room").value = params.get("room") || "";
try { $("name").value = localStorage.getItem("pallopeli-nimi") || ""; } catch {}
$("join").onclick = join;
[$("name"), $("room")].forEach((el) => el.addEventListener("keydown", (e) => { if (e.key === "Enter") join(); }));

// ====== Three.js-näkymä ======
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc4e4);
scene.fog = new THREE.Fog(0x9cc4e4, 60, 170);

const camera = new THREE.PerspectiveCamera(80, innerWidth / innerHeight, 0.05, 300);
camera.rotation.order = "YXZ";
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xdfefff, 0x4a4a3a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(25, 40, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 70, bottom: -70, near: 1, far: 160 });
scene.add(sun);

// Lattia ruudukolla
{
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#5d6b4f"; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = "#4c5841"; g.lineWidth = 4; g.strokeRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(ARENA_X, ARENA_Z);
  tex.colorSpace = THREE.SRGBColorSpace;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA_X * 2, ARENA_Z * 2), new THREE.MeshStandardMaterial({ map: tex }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
}

// Ulkoseinät
for (const [x, z, w, d] of [[0, -ARENA_Z - 0.5, ARENA_X * 2 + 2, 1], [0, ARENA_Z + 0.5, ARENA_X * 2 + 2, 1], [-ARENA_X - 0.5, 0, 1, ARENA_Z * 2], [ARENA_X + 0.5, 0, 1, ARENA_Z * 2]]) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 4, d), new THREE.MeshStandardMaterial({ color: 0x3b4252 }));
  wall.position.set(x, 2, z);
  wall.receiveShadow = true;
  scene.add(wall);
}

// Kartan laatikot
for (const b of BOXES) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, b.d), new THREE.MeshStandardMaterial({ color: b.color }));
  mesh.position.set(b.x, b.minY + b.h / 2, b.z);
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
}

// Toisen pelaajan hahmo: vartalo, pää, visiiri (näyttää katseen suunnan) ja ase
function makeAvatar(p) {
  const c = CLASSES[p.k] || CLASSES.sotilas;
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: p.c });
  const dark = new THREE.MeshStandardMaterial({ color: 0x1f2329 });

  const bodyH = c.height * 0.62;
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(c.radius, Math.max(0.05, bodyH - 2 * c.radius), 6, 12), mat);
  body.position.y = bodyH / 2 + 0.02;
  body.castShadow = true;
  group.add(body);

  // Yläosa (pää + ase) kääntyy myös pystysuunnassa katseen mukaan
  const upper = new THREE.Group();
  upper.position.y = c.height * 0.82;
  group.add(upper);

  const headR = c.radius * 0.62;
  const head = new THREE.Mesh(new THREE.SphereGeometry(headR, 16, 12), mat);
  head.castShadow = true;
  upper.add(head);

  const visor = new THREE.Mesh(new THREE.BoxGeometry(headR * 1.3, headR * 0.45, headR * 0.5), dark);
  visor.position.set(0, headR * 0.1, -headR * 0.8);
  upper.add(visor);

  const gun = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.7), dark);
  gun.position.set(c.radius * 0.9, -c.height * 0.15, -0.35);
  gun.castShadow = true;
  upper.add(gun);

  // Nimi pään yläpuolelle
  const cv = document.createElement("canvas");
  cv.width = 256; cv.height = 64;
  const g = cv.getContext("2d");
  g.font = "bold 34px system-ui, sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.lineWidth = 6; g.strokeStyle = "rgba(0,0,0,.7)"; g.strokeText(p.n, 128, 32);
  g.fillStyle = "#fff"; g.fillText(p.n, 128, 32);
  const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthWrite: false }));
  label.scale.set(1.6, 0.4, 1);
  label.position.y = c.height + 0.45;
  group.add(label);

  scene.add(group);
  return { group, upper, k: p.k, n: p.n };
}

function removeAvatar(av) {
  scene.remove(av.group);
  av.group.traverse((o) => { o.geometry?.dispose?.(); o.material?.map?.dispose?.(); o.material?.dispose?.(); });
}

// ====== Oma pelaaja ja fysiikka ======
const me = { x: 0, y: 0, z: 0, vy: 0, yaw: 0, pitch: 0, grounded: true, cls: CLASSES.sotilas };
const keys = {};
let jumpQueued = false; // lyhytkin välilyönnin napautus hyppää

function overlapsXZ(x, z, b, r) {
  return x + r > b.minX && x - r < b.maxX && z + r > b.minZ && z - r < b.maxZ;
}
function overlaps(x, y, z, b, r, h) {
  return overlapsXZ(x, z, b, r) && y < b.maxY && y + h > b.minY;
}

// Liikutetaan yhtä akselia kerrallaan ja työnnetään pois laatikoista
function moveAxis(axis, delta) {
  const r = me.cls.radius, h = me.cls.height;
  me[axis] += delta;
  for (const b of BOXES) {
    if (!overlaps(me.x, me.y, me.z, b, r, h)) continue;
    // Matala este (porras): noustaan sen päälle, jos yläpuolella on tilaa
    if (b.maxY - me.y <= STEP && me.grounded && !BOXES.some((o) => o !== b && overlaps(me.x, b.maxY, me.z, o, r, h))) {
      me.y = b.maxY;
      continue;
    }
    if (axis === "x") me.x = delta > 0 ? b.minX - r - 1e-4 : b.maxX + r + 1e-4;
    else me.z = delta > 0 ? b.minZ - r - 1e-4 : b.maxZ + r + 1e-4;
  }
  const lim = (axis === "x" ? ARENA_X : ARENA_Z) - r;
  me[axis] = Math.max(-lim, Math.min(lim, me[axis]));
}

function physics(dt) {
  const c = me.cls;
  // Liikesuunta katseen mukaan (W = eteenpäin = -z kameran suunnassa)
  let f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  let s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const len = Math.hypot(f, s) || 1;
  f /= len; s /= len;
  const sin = Math.sin(me.yaw), cos = Math.cos(me.yaw);
  const vx = (-sin * f + cos * s) * c.speed;
  const vz = (-cos * f - sin * s) * c.speed;

  moveAxis("x", vx * dt);
  moveAxis("z", vz * dt);

  // Painovoima ja hyppy
  if ((keys.Space || jumpQueued) && me.grounded) { me.vy = c.jump; me.grounded = false; }
  jumpQueued = false;
  me.vy -= GRAVITY * dt;
  const newY = me.y + me.vy * dt;
  me.grounded = false;
  // Alla oleva lattia (korkein pinta jalkojen alla) ja yllä oleva katto (matalin pinta pään yllä)
  let ground = 0, ceiling = Infinity;
  for (const b of BOXES) {
    if (!overlapsXZ(me.x, me.z, b, c.radius)) continue;
    if (me.y >= b.maxY - 1e-3) ground = Math.max(ground, b.maxY);
    else if (me.y + c.height <= b.minY + 1e-3) ceiling = Math.min(ceiling, b.minY);
  }
  if (newY <= ground) { me.y = ground; me.vy = 0; me.grounded = true; }
  else if (newY + c.height > ceiling) { me.y = ceiling - c.height; me.vy = 0; } // pää kolahtaa kattoon
  else me.y = newY;
}

// ====== Hiiri (pointer lock) ======
const canvas = renderer.domElement;
let joined = false;
function locked() { return document.pointerLockElement === canvas; }
$("pause").onclick = () => canvas.requestPointerLock();
canvas.addEventListener("click", () => { if (joined && !locked()) canvas.requestPointerLock(); });
document.addEventListener("pointerlockchange", () => {
  $("pause").style.display = joined && !locked() ? "flex" : "none";
  $("cross").style.display = locked() ? "block" : "none";
  if (!locked()) for (const k in keys) keys[k] = false;
});
document.addEventListener("mousemove", (e) => {
  if (!locked()) return;
  me.yaw -= e.movementX * SENS;
  me.pitch = Math.max(-1.55, Math.min(1.55, me.pitch - e.movementY * SENS));
});
addEventListener("keydown", (e) => {
  if (!joined) return;
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === "Space") jumpQueued = true;
});
addEventListener("keyup", (e) => { keys[e.code] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ====== Verkko ======
let ws = null, myId = null, roomName = "";
let snapshots = [];
const avatars = new Map();

function join() {
  const name = $("name").value.trim() || "Pelaaja";
  roomName = ($("room").value.trim() || "aula").toLowerCase();
  try { localStorage.setItem("pallopeli-nimi", name); localStorage.setItem("areena-hahmo", chosenClass); } catch {}
  const u = new URL(location.href);
  u.searchParams.set("room", roomName);
  history.replaceState(null, "", u);

  $("msg").textContent = "Yhdistetään…";
  snapshots = [];
  me.cls = CLASSES[chosenClass];
  ws = new WebSocket(`${SERVER}/ws?room=${encodeURIComponent(roomName)}&name=${encodeURIComponent(name)}&cls=${chosenClass}`);

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === "welcome") {
      myId = msg.id;
      Object.assign(me, msg.spawn, { vy: 0, pitch: 0, grounded: true });
      joined = true;
      $("msg").textContent = "";
      $("lobby").style.display = "none";
      $("copy").style.display = "block";
      canvas.requestPointerLock?.();
      $("pause").style.display = locked() ? "none" : "flex";
    } else if (msg.type === "state") {
      snapshots.push({ time: performance.now(), players: new Map(msg.players.map((p) => [p.id, p])) });
      if (snapshots.length > 30) snapshots.shift();
    } else if (msg.type === "correct") {
      Object.assign(me, { x: msg.x, y: msg.y, z: msg.z, vy: 0 });
    } else if (msg.type === "full") {
      $("msg").textContent = "Huone on täynnä. Kokeile toista huonetta.";
    }
  };

  ws.onclose = () => {
    if (joined) $("msg").textContent = "Yhteys katkesi. Liity uudelleen.";
    else if ($("msg").textContent === "Yhdistetään…") $("msg").textContent = "Palvelimeen ei saatu yhteyttä (" + SERVER + ").";
    joined = false; myId = null;
    $("lobby").style.display = "flex";
    $("pause").style.display = "none";
    $("copy").style.display = "none";
    document.exitPointerLock?.();
    for (const av of avatars.values()) removeAvatar(av);
    avatars.clear();
  };
}

let lastSend = 0, lastSent = "";
function sendMove(now) {
  if (!ws || ws.readyState !== WebSocket.OPEN || now - lastSend < SEND_MS) return;
  lastSend = now;
  const msg = JSON.stringify({ type: "move", x: +me.x.toFixed(2), y: +me.y.toFixed(2), z: +me.z.toFixed(2), yaw: +me.yaw.toFixed(3), pitch: +me.pitch.toFixed(3) });
  if (msg !== lastSent) { ws.send(msg); lastSent = msg; } // paikallaan seistessä ei lähetetä mitään
}

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $("copy").textContent = "Linkki kopioitu!"; }
  catch { prompt("Kopioi linkki:", location.href); }
  setTimeout(() => ($("copy").textContent = "Kopioi huoneen linkki"), 1500);
};

// Muiden pelaajien interpoloitu tila
function lerpAngle(a, b, t) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
function currentView() {
  if (snapshots.length === 0) return new Map();
  const renderTime = performance.now() - INTERP_DELAY;
  let i = snapshots.length - 1;
  while (i > 0 && snapshots[i - 1].time > renderTime) i--;
  const b = snapshots[i], a = snapshots[i - 1];
  if (!a || renderTime >= b.time) return b.players;
  const t = Math.max(0, Math.min(1, (renderTime - a.time) / (b.time - a.time)));
  const out = new Map();
  for (const [id, pb] of b.players) {
    const pa = a.players.get(id);
    out.set(id, pa ? { ...pb, x: pa.x + (pb.x - pa.x) * t, y: pa.y + (pb.y - pa.y) * t, z: pa.z + (pb.z - pa.z) * t, yw: lerpAngle(pa.yw, pb.yw, t), p: pa.p + (pb.p - pa.p) * t } : pb);
  }
  return out;
}

// ====== Pelisilmukka ======
let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;

  if (joined) {
    if (locked()) physics(dt);
    else { me.vy = 0; } // tauolla ei liikuta
    sendMove(now);
  }

  camera.position.set(me.x, me.y + me.cls.height * 0.9, me.z);
  camera.rotation.set(me.pitch, me.yaw, 0);

  // Muut pelaajat
  const view = currentView();
  for (const [id, av] of avatars) {
    if (!view.has(id) || id === myId) { removeAvatar(av); avatars.delete(id); }
  }
  for (const [id, p] of view) {
    if (id === myId) continue;
    let av = avatars.get(id);
    if (av && (av.k !== p.k || av.n !== p.n)) { removeAvatar(av); avatars.delete(id); av = null; }
    if (!av) { av = makeAvatar(p); avatars.set(id, av); }
    av.group.position.set(p.x, p.y, p.z);
    av.group.rotation.y = p.yw;
    av.upper.rotation.x = p.p;
  }

  // HUD
  if (joined) {
    $("hud").textContent = `Huone: ${roomName} · ${me.cls.name} · pelaajia ${view.size}`;
    $("list").innerHTML = [...view.values()].map((p) =>
      `<div><span style="color:${p.c}">●</span> ${esc(p.n)} <span style="color:#aab">(${CLASSES[p.k]?.name || ""})</span>${p.id === myId ? " · sinä" : ""}</div>`).join("");
  } else { $("hud").textContent = ""; $("list").innerHTML = ""; }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
requestAnimationFrame(frame);

// Testausta varten: window.areena näyttää oman tilan konsolissa
window.areena = { me, keys, physics, get others() { return currentView(); } };
</script>
